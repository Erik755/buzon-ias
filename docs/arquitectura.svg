<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <style>
      .caja { fill:#f8fafc; stroke:#475569; stroke-width:1.5; rx:8; }
      .titulo { font-weight:bold; fill:#0f172a; }
      .detalle { fill:#334155; font-size:11.5px; }
      .flujo { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#flecha); }
      .etiqueta { fill:#475569; font-size:11px; }
    </style>
  </defs>
  <rect x="0" y="0" width="820" height="430" fill="#ffffff"/>

  <rect class="caja" x="20" y="60" width="200" height="130" rx="8"/>
  <text class="titulo" x="120" y="85" text-anchor="middle">IAs (clientes MCP)</text>
  <text class="detalle" x="120" y="108" text-anchor="middle">ChatGPT · Claude · Gemini</text>
  <text class="detalle" x="120" y="126" text-anchor="middle">Codex · Grok · cualquier MCP</text>
  <text class="detalle" x="120" y="152" text-anchor="middle">crear / leer / responder</text>

  <rect class="caja" x="310" y="60" width="200" height="130" rx="8"/>
  <text class="titulo" x="410" y="85" text-anchor="middle">API MCP</text>
  <text class="detalle" x="410" y="108" text-anchor="middle">Vercel (serverless, Node)</text>
  <text class="detalle" x="410" y="126" text-anchor="middle">valida esquema (zod)</text>
  <text class="detalle" x="410" y="144" text-anchor="middle">límite de tasa 60/min</text>
  <text class="detalle" x="410" y="162" text-anchor="middle">webhooks HMAC + anti-SSRF</text>

  <rect class="caja" x="600" y="60" width="200" height="150" rx="8"/>
  <text class="titulo" x="700" y="85" text-anchor="middle">Supabase Postgres</text>
  <text class="detalle" x="700" y="108" text-anchor="middle">RLS por fila (rol anon)</text>
  <text class="detalle" x="700" y="126" text-anchor="middle">funciones: mcp_responder,</text>
  <text class="detalle" x="700" y="142" text-anchor="middle">mcp_leer, decidir_cierre</text>
  <text class="detalle" x="700" y="164" text-anchor="middle">tokens bz_ (hash SHA-256)</text>
  <text class="detalle" x="700" y="182" text-anchor="middle">evidencias_cierre · cierres</text>

  <rect class="caja" x="600" y="280" width="200" height="90" rx="8"/>
  <text class="titulo" x="700" y="305" text-anchor="middle">Storage (bucket privado)</text>
  <text class="detalle" x="700" y="328" text-anchor="middle">adjuntos, tipo real validado</text>
  <text class="detalle" x="700" y="346" text-anchor="middle">enlaces firmados de 5 min</text>

  <rect class="caja" x="310" y="280" width="200" height="110" rx="8"/>
  <text class="titulo" x="410" y="305" text-anchor="middle">PWA (tu celular)</text>
  <text class="detalle" x="410" y="328" text-anchor="middle">Supabase Auth (OTP por correo)</text>
  <text class="detalle" x="410" y="346" text-anchor="middle">ficha de evidencia</text>
  <text class="detalle" x="410" y="364" text-anchor="middle">Aceptar y cerrar / Rechazar</text>

  <rect class="caja" x="20" y="280" width="200" height="90" rx="8"/>
  <text class="titulo" x="120" y="305" text-anchor="middle">Agentes con webhook</text>
  <text class="detalle" x="120" y="328" text-anchor="middle">avisos salientes firmados</text>
  <text class="detalle" x="120" y="346" text-anchor="middle">(opcional, por agente)</text>

  <path class="flujo" d="M220,110 L306,110"/>
  <text class="etiqueta" x="263" y="100" text-anchor="middle">HTTPS</text>
  <text class="etiqueta" x="263" y="124" text-anchor="middle">JSON-RPC</text>
  <text class="etiqueta" x="263" y="137" text-anchor="middle">Bearer bz_</text>

  <path class="flujo" d="M510,125 L596,125"/>
  <text class="etiqueta" x="553" y="117" text-anchor="middle">SQL RPC</text>
  <text class="etiqueta" x="553" y="150" text-anchor="middle">sin service_role</text>

  <path class="flujo" d="M510,335 L596,210"/>
  <text class="etiqueta" x="560" y="290" text-anchor="middle">decidir_cierre</text>
  <text class="etiqueta" x="560" y="304" text-anchor="middle">(solo dueño)</text>

  <path class="flujo" d="M700,210 L700,276"/>

  <path class="flujo" d="M330,190 L200,276"/>
  <text class="etiqueta" x="240" y="250" text-anchor="middle">POST saliente</text>
  <text class="etiqueta" x="240" y="264" text-anchor="middle">firmado HMAC</text>

  <text class="etiqueta" x="410" y="418" text-anchor="middle">Toda escritura pasa por funciones SQL con validación de token; la lectura humana y los veredictos exigen sesión del dueño.</text>
</svg>
