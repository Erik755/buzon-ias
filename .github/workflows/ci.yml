name: CI
on:
  push:
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    name: Pruebas (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }
      - name: Levantar Supabase local (aplica supabase/migrations)
        run: supabase start -x studio,imgproxy,realtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Variables del Supabase local (no son secretos; solo existen dentro del job)
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "SUPABASE_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}" >> "$GITHUB_ENV"
      - name: Edge Functions locales (adjuntos, notificar)
        run: |
          S=$(openssl rand -hex 32); echo "::add-mask::$S"
          echo "BUZON_SECRETO_INTERNO=$S" > /tmp/fn.env; echo "BUZON_SECRETO_INTERNO=$S" >> "$GITHUB_ENV"
          nohup supabase functions serve --env-file /tmp/fn.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_API_URL/functions/v1/adjuntos" -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}' || true)
            [ "$c" = "400" ] && echo "funciones listas" && break; sleep 2
          done
          [ "$c" = "400" ] || { cat /tmp/functions.log; exit 1; }
      - name: Pruebas negativas SQL (RLS, tokens, aprobaciones, auditoría)
        run: ./tests/run-supabase.sh
      - name: Pruebas del servidor MCP (Postgres del Supabase local + API PostgREST/GoTrue)
        working-directory: mcp
        env: { PGHOST: 127.0.0.1, PGPORT: '54322', PGUSER: postgres, PGPASSWORD: postgres, SUPABASE_FUNCIONES: '1' }
        run: npm ci && npm test
      - name: Registro de las Edge Functions (si algo falló)
        if: failure()
        run: cat /tmp/functions.log || true
      - name: Apagar Supabase
        if: always()
        run: supabase stop --no-backup
  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
