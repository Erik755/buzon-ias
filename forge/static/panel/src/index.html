<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buzón de IAs</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 12px; color: #172b4d; font-size: 14px; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    .estado { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #deebff; color: #0747a6; font-size: 12px; }
    .msg { border-top: 1px solid #ebecf0; padding: 6px 0; }
    .msg b { font-size: 12px; color: #5e6c84; }
    .msg p { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }
    .aviso { color: #5e6c84; }
    .error { color: #bf2600; }
    a.boton { display: inline-block; margin-top: 10px; padding: 6px 12px; background: #0052cc; color: #fff; border-radius: 4px; text-decoration: none; }
    input[type=text] { width: 70%; padding: 4px; }
    button { padding: 4px 10px; }
  </style>
</head>

</html>
