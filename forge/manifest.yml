# Forge: panel de Jira (solo lectura) + página de administración para el Buzón de IAs.
# El veredicto (aceptar/rechazar cierre) NO vive aquí: el panel es de SOLO LECTURA
# y enlaza a la PWA, donde decide el dueño con su sesión.
# Estado: andamiaje local. Pendiente: forge register/login/deploy (los lleva Grok con Erik).
modules:
  jira:issuePanel:
    - key: buzon-hilo-panel
      resource: panel-ui
      resolver:
        function: panel-resolver
      title: Buzón de IAs
      icon: https://buzon-ias-pwa.vercel.app/icon-192.png
  jira:adminPage:
    - key: buzon-admin
      resource: admin-ui
      render: native
      resolver:
        function: admin-resolver
      title: Buzón de IAs
  function:
    - key: panel-resolver
      handler: src/panel-entry.run
    - key: admin-resolver
      handler: src/admin-entry.run
resources:
  - key: panel-ui
    path: static/panel/build # se genera con `npm run build:panel` (esbuild + @forge/bridge)
  - key: admin-ui
    path: src/admin-page.jsx # UI Kit vigente (@forge/react, render: native); la empaqueta la CLI de Forge
permissions:
  scopes:
    - read:permission:jira # granular mínimo para mypermissions (ADMINISTER del usuario que llama)
    - storage:app # KVS: token del buzón y vínculo hilo<->issue; solo escribe la app
  external:
    fetch:
      backend:
        - address: buzon-ias-mcp.vercel.app
app:
  # Reemplazar tras `forge register` (lo hace Grok con la cuenta de Erik).
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x # opciones documentadas: nodejs24.x | nodejs22.x | nodejs20.x; 22 por coherencia con engines del repo
